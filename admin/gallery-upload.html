<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria 4:5 — Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a1a; color: #e2e8f0; min-height: 100vh; }
        .header { background: #1e293b; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .header h1 { font-size: 1rem; font-weight: 700; }
        .header a { color: #93c5fd; text-decoration: none; font-size: 0.85rem; }
        .layout { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; gap: 1.5rem; }
        @media (min-width: 768px) { .layout { grid-template-columns: 1fr 1fr; align-items: start; } }
        .panel { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.25rem; }
        .panel h2 { font-size: 0.9rem; font-weight: 700; color: #c9a96e; margin-bottom: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .upload-zone {
            border: 2px dashed rgba(201, 169, 110, 0.45);
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(26, 16, 64, 0.4);
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: #c9a96e; background: rgba(67, 56, 202, 0.15); }
        .upload-zone p { font-size: 0.9rem; color: #94a3b8; margin-top: 0.5rem; }
        .upload-zone strong { color: #f8fafc; display: block; font-size: 1rem; }
        .upload-zone input { display: none; }
        .crop-stage { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .crop-frame {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 4 / 5;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1040;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .crop-frame:active { cursor: grabbing; }
        .crop-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            pointer-events: none;
        }
        .crop-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.28) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.28) 1px, transparent 1px);
            background-size: calc(100% / 3) 100%, 100% calc(100% / 3);
        }
        .crop-grid::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .crop-hint { font-size: 0.75rem; color: #64748b; text-align: center; }
        .controls { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 0.65rem; }
        .control-row { display: flex; align-items: center; gap: 0.75rem; }
        .control-row label { min-width: 90px; font-size: 0.75rem; font-weight: 600; color: #94a3b8; }
        .control-row input[type="range"] { flex: 1; accent-color: #4338ca; height: 5px; }
        .control-row .value { min-width: 42px; text-align: center; font-size: 0.75rem; font-weight: 700; color: #a5b4fc; }
        .field { margin-top: 0.75rem; }
        .field label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.35rem; }
        .field input[type="text"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.85rem;
        }
        .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.25rem;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #4338ca; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #3730a3; }
        .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.15); }
        .status { font-size: 0.8rem; margin-top: 0.75rem; min-height: 1.2em; }
        .status.ok { color: #4ade80; }
        .status.err { color: #f87171; }
        .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 0.5rem; }
        .thumb {
            aspect-ratio: 4 / 5;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.85;
            transition: border-color 0.2s, opacity 0.2s;
            position: relative;
        }
        .thumb:hover { opacity: 1; }
        .thumb.active { border-color: #4338ca; opacity: 1; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-delete {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.92);
            color: #fff;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .thumb:hover .thumb-delete,
        .thumb.active .thumb-delete { opacity: 1; }
        .empty { color: #64748b; font-size: 0.85rem; padding: 1rem 0; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 3rem; color: #64748b; }
        .local-badge {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: #86efac;
            font-size: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 Galeria — formato 4:5 (Instagram)</h1>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;">
            <a href="adjust.html">Ajustar outras imagens</a>
            <a href="/admin/">← Admin</a>
        </div>
    </div>

    <div class="layout" id="app">
        <div class="loading">Carregando...</div>
    </div>

    <script>
    var REPO = 'eudenysjackson/sitedenysjackson';
    var BRANCH = 'main';
    var LOCAL_API = 'http://localhost:8082';
    var isLocalMode = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    var token = '';
    var galleryData = { photos: [] };
    var gallerySha = '';
    var posX = 50;
    var posY = 50;
    var previewUrl = '';
    var pendingFile = null;
    var editingIndex = -1;
    var isNewUpload = false;
    var panState = null;

    async function localFetchGallery() {
        var res = await fetch(LOCAL_API + '/api/gallery');
        if (!res.ok) throw new Error('API local offline');
        return await res.json();
    }

    async function localSaveGallery(data) {
        var res = await fetch(LOCAL_API + '/api/gallery', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Erro ao salvar gallery.json');
    }

    async function localUploadImage(filename, base64) {
        var res = await fetch(LOCAL_API + '/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename, data: base64 })
        });
        if (!res.ok) throw new Error('Erro ao salvar imagem');
        return await res.json();
    }

    async function checkLocalApi() {
        var res = await fetch(LOCAL_API + '/api/health');
        return res.ok;
    }

    function getToken() {
        try {
            var keys = Object.keys(localStorage);
            for (var i = 0; i < keys.length; i++) {
                var val = localStorage.getItem(keys[i]);
                if (val && (val.startsWith('ghp_') || val.startsWith('github_pat_'))) return val;
                try {
                    var parsed = JSON.parse(val);
                    if (parsed && parsed.token) return parsed.token;
                    if (parsed && parsed.access_token) return parsed.access_token;
                } catch (e) {}
            }
        } catch (e) {}
        return prompt('Cole seu token do GitHub (ghp_...):');
    }

    async function ghFetch(path) {
        var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH, {
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('GitHub API: ' + res.status);
        return await res.json();
    }

    async function ghPut(path, contentB64, message, sha) {
        var body = { message: message, content: contentB64, branch: BRANCH };
        if (sha) body.sha = sha;
        var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Erro ao salvar: ' + res.status);
        return await res.json();
    }

    function fixImg(p) {
        if (!p) return '';
        var raw = String(p).trim();
        if (/^https?:\/\//i.test(raw)) return raw;
        var pathPart = raw.startsWith('/') ? raw.substring(1) : raw;
        var encoded = pathPart.split('/').map(function(seg) {
            if (!seg) return seg;
            try { return encodeURIComponent(decodeURIComponent(seg)); } catch (e) { return encodeURIComponent(seg); }
        }).join('/');
        return '/' + encoded;
    }

    function slugify(name) {
        return name.toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') || 'foto';
    }

    function renderApp() {
        var localBanner = isLocalMode
            ? '<div class="local-badge">Modo local — salva só na sua pasta. Não publica no site ao vivo. Recarregue <a href="http://localhost:8080/#midias" style="color:#bbf7d0">localhost:8080/#midias</a> para ver.</div>'
            : '';

        document.getElementById('app').innerHTML = localBanner +
            '<div class="panel">' +
                '<h2>Nova foto</h2>' +
                '<div class="upload-zone" id="upload-zone">' +
                    '<input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">' +
                    '<strong>Arraste ou clique para enviar</strong>' +
                    '<p>Formato 4:5 · JPG, PNG ou WebP · ideal 1080×1350px</p>' +
                '</div>' +
                '<div id="editor" class="crop-stage hidden" style="margin-top:1rem;">' +
                    '<div class="crop-frame" id="crop-frame">' +
                        '<img id="crop-img" src="" alt="Preview">' +
                        '<div class="crop-grid"></div>' +
                    '</div>' +
                    '<p class="crop-hint">Arraste a imagem ou use os controles para centralizar na grade</p>' +
                    '<div class="controls">' +
                        '<div class="control-row"><label>Horizontal</label><input type="range" id="pos-x" min="0" max="100" value="50"><span class="value" id="pos-x-val">50%</span></div>' +
                        '<div class="control-row"><label>Vertical</label><input type="range" id="pos-y" min="0" max="100" value="50"><span class="value" id="pos-y-val">50%</span></div>' +
                    '</div>' +
                    '<div class="field"><label>Legenda (opcional)</label><input type="text" id="caption" placeholder="Ex: Show no Imperator"></div>' +
                    '<div class="btn-row">' +
                        '<button class="btn btn-primary" id="save-btn" onclick="savePhoto()">' + (isLocalMode ? 'Salvar localmente' : 'Publicar no site') + '</button>' +
                        '<button class="btn btn-ghost" onclick="resetEditor()">Cancelar</button>' +
                    '</div>' +
                    '<div class="status" id="status"></div>' +
                '</div>' +
            '</div>' +
            '<div class="panel">' +
                '<h2>Fotos publicadas</h2>' +
                '<p style="font-size:0.75rem;color:#64748b;margin:-0.5rem 0 0.75rem;">Clique na foto para ajustar · passe o mouse e use × para excluir</p>' +
                '<div class="thumb-grid" id="thumb-grid"></div>' +
            '</div>';

        bindUpload();
        bindPan();
        document.getElementById('pos-x').addEventListener('input', syncFromSliders);
        document.getElementById('pos-y').addEventListener('input', syncFromSliders);
        renderThumbs();
    }

    function bindUpload() {
        var zone = document.getElementById('upload-zone');
        var input = document.getElementById('file-input');
        zone.addEventListener('click', function() { input.click(); });
        zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
        zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
        zone.addEventListener('drop', function(e) {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
        });
        input.addEventListener('change', function() {
            if (input.files[0]) loadFile(input.files[0]);
        });
    }

    function loadFile(file) {
        if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
            setStatus('err', 'Use JPG, PNG ou WebP.');
            return;
        }
        pendingFile = file;
        isNewUpload = true;
        editingIndex = -1;
        if (previewUrl && previewUrl.startsWith('blob:')) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);
        showEditor(previewUrl, 50, 50, '');
    }

    function showEditor(src, x, y, caption) {
        posX = x;
        posY = y;
        document.getElementById('editor').classList.remove('hidden');
        document.getElementById('upload-zone').classList.add('hidden');
        document.getElementById('crop-img').src = src;
        document.getElementById('caption').value = caption || '';
        document.getElementById('pos-x').value = x;
        document.getElementById('pos-y').value = y;
        syncFromSliders();
    }

    function resetEditor() {
        document.getElementById('editor').classList.add('hidden');
        document.getElementById('upload-zone').classList.remove('hidden');
        pendingFile = null;
        isNewUpload = false;
        editingIndex = -1;
        document.querySelectorAll('.thumb').forEach(function(t) { t.classList.remove('active'); });
        setStatus('', '');
    }

    function syncFromSliders() {
        posX = parseInt(document.getElementById('pos-x').value, 10);
        posY = parseInt(document.getElementById('pos-y').value, 10);
        document.getElementById('pos-x-val').textContent = posX + '%';
        document.getElementById('pos-y-val').textContent = posY + '%';
        var img = document.getElementById('crop-img');
        if (img) img.style.objectPosition = posX + '% ' + posY + '%';
    }

    function bindPan() {
        document.addEventListener('touchmove', onPanMove, { passive: false });
        document.addEventListener('touchend', endPan);
    }

    function startPan(e) {
        var frame = document.getElementById('crop-frame');
        if (!frame || document.getElementById('editor').classList.contains('hidden')) return;
        e.preventDefault();
        var pt = e.touches ? e.touches[0] : e;
        panState = { startX: pt.clientX, startY: pt.clientY, startPosX: posX, startPosY: posY, w: frame.offsetWidth, h: frame.offsetHeight };
    }

    function onPanMove(e) {
        if (!panState) return;
        e.preventDefault();
        var pt = e.touches ? e.touches[0] : e;
        var dx = pt.clientX - panState.startX;
        var dy = pt.clientY - panState.startY;
        posX = Math.max(0, Math.min(100, Math.round(panState.startPosX - (dx / panState.w) * 100)));
        posY = Math.max(0, Math.min(100, Math.round(panState.startPosY - (dy / panState.h) * 100)));
        document.getElementById('pos-x').value = posX;
        document.getElementById('pos-y').value = posY;
        syncFromSliders();
    }

    document.addEventListener('mousemove', function(e) {
        if (!panState || e.touches) return;
        onPanMove(e);
    });
    document.addEventListener('mouseup', endPan);

    function endPan() { panState = null; }

    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('mousedown', function(e) {
            if (e.target.closest('#crop-frame')) startPan(e);
        });
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('#crop-frame')) startPan(e);
        }, { passive: false });
    });

    function renderThumbs() {
        var grid = document.getElementById('thumb-grid');
        if (!galleryData.photos.length) {
            grid.innerHTML = '<p class="empty">Nenhuma foto ainda.</p>';
            return;
        }
        grid.innerHTML = galleryData.photos.map(function(p, i) {
            var cap = p.caption ? escapeHtml(p.caption) : 'Foto ' + (i + 1);
            return '<div class="thumb" id="thumb-' + i + '">' +
                '<button type="button" class="thumb-delete" title="Excluir" onclick="deletePhoto(' + i + ', event)">×</button>' +
                '<img src="' + fixImg(p.image) + '" alt="' + cap + '" onclick="editExisting(' + i + ')">' +
                '</div>';
        }).join('');
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    async function deletePhoto(i, e) {
        if (e) e.stopPropagation();
        var photo = galleryData.photos[i];
        var label = photo.caption || ('Foto ' + (i + 1));
        if (!confirm('Excluir "' + label + '" da galeria?')) return;

        galleryData.photos.splice(i, 1);
        if (editingIndex === i) resetEditor();
        else if (editingIndex > i) editingIndex--;

        try {
            if (isLocalMode) {
                await localSaveGallery(galleryData);
                setStatus('ok', 'Foto removida localmente.');
            } else {
                var result = await ghPut('content/gallery.json', btoa(unescape(encodeURIComponent(JSON.stringify(galleryData, null, 2) + '\n'))), 'Remover foto da galeria', gallerySha);
                gallerySha = result.content.sha;
                setStatus('ok', 'Foto removida. Site atualiza em 1–3 min.');
            }
            renderThumbs();
        } catch (err) {
            setStatus('err', err.message);
        }
    }

    function editExisting(i) {
        editingIndex = i;
        isNewUpload = false;
        pendingFile = null;
        var photo = galleryData.photos[i];
        var pos = (photo.position || '50% 50%').replace(/%/g, '').trim().split(/\s+/);
        document.querySelectorAll('.thumb').forEach(function(t) { t.classList.remove('active'); });
        document.getElementById('thumb-' + i).classList.add('active');
        var px = parseInt(pos[0], 10);
        var py = parseInt(pos[1], 10);
        showEditor(fixImg(photo.image), isNaN(px) ? 50 : px, isNaN(py) ? 50 : py, photo.caption || '');
    }

    function readFileAsBase64(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function() { resolve(reader.result.split(',')[1]); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function savePhoto() {
        var btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.textContent = isLocalMode ? 'Salvando...' : 'Publicando...';
        var posStr = posX + '% ' + posY + '%';
        var caption = document.getElementById('caption').value.trim();

        try {
            if (isNewUpload && pendingFile) {
                var ext = pendingFile.name.split('.').pop().toLowerCase();
                if (ext === 'jpeg') ext = 'jpg';
                var fname = 'gallery-' + slugify(pendingFile.name.replace(/\.[^.]+$/, '')) + '-' + Date.now() + '.' + ext;
                var b64 = await readFileAsBase64(pendingFile);

                if (isLocalMode) {
                    var uploaded = await localUploadImage(fname, b64);
                    galleryData.photos.push({
                        image: uploaded.path,
                        caption: caption,
                        position: posStr,
                        position_mobile: posStr
                    });
                } else {
                    await ghPut('images/uploads/' + fname, b64, 'Upload galeria 4:5: ' + fname);
                    galleryData.photos.push({
                        image: '/images/uploads/' + fname,
                        caption: caption,
                        position: posStr,
                        position_mobile: posStr
                    });
                }
            } else if (editingIndex >= 0) {
                galleryData.photos[editingIndex].caption = caption;
                galleryData.photos[editingIndex].position = posStr;
                galleryData.photos[editingIndex].position_mobile = posStr;
            } else {
                throw new Error('Selecione ou envie uma imagem.');
            }

            if (isLocalMode) {
                await localSaveGallery(galleryData);
                setStatus('ok', 'Salvo localmente! Abra localhost:8080/#midias e recarregue (Ctrl+Shift+R).');
            } else {
                var result = await ghPut('content/gallery.json', btoa(unescape(encodeURIComponent(JSON.stringify(galleryData, null, 2) + '\n'))), 'Atualizar galeria 4:5', gallerySha);
                gallerySha = result.content.sha;
                setStatus('ok', 'Publicado! O site atualiza em 1–3 min.');
            }
            renderThumbs();
            if (isNewUpload) resetEditor();
        } catch (e) {
            setStatus('err', e.message);
        }
        btn.disabled = false;
        btn.textContent = isLocalMode ? 'Salvar localmente' : 'Publicar no site';
    }

    function setStatus(type, msg) {
        var el = document.getElementById('status');
        if (!el) return;
        el.textContent = msg;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    async function init() {
        if (isLocalMode) {
            try {
                if (!(await checkLocalApi())) throw new Error('offline');
                galleryData = await localFetchGallery();
                if (!galleryData.photos) galleryData.photos = [];
            } catch (e) {
                document.getElementById('app').innerHTML =
                    '<div class="loading" style="max-width:520px;margin:2rem auto;line-height:1.6;">' +
                    '<strong style="color:#f87171;display:block;margin-bottom:0.75rem;">API local não está rodando</strong>' +
                    'Abra um terminal na pasta do projeto e execute:<br><br>' +
                    '<code style="background:#1e293b;padding:0.5rem;border-radius:6px;display:block;">node scripts/local-api.js</code><br>' +
                    'Depois recarregue esta página.' +
                    '</div>';
                return;
            }
            renderApp();
            return;
        }

        token = getToken();
        if (!token) {
            document.getElementById('app').innerHTML = '<div class="loading">Token necessário.</div>';
            return;
        }
        try {
            var file = await ghFetch('content/gallery.json');
            gallerySha = file.sha;
            galleryData = JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g, '')))));
            if (!galleryData.photos) galleryData.photos = [];
        } catch (e) {
            galleryData = { photos: [] };
        }
        renderApp();
    }

    init();
    </script>
</body>
</html>
